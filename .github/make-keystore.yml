name: Create signing key (run once)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keystore:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Generate the key
        run: |
          PASS=$(openssl rand -hex 16)
          keytool -genkeypair -keystore lindaplay.jks -storetype PKCS12 \
            -alias lindaplay -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PASS" -keypass "$PASS" \
            -dname "CN=Linda Play, O=DEH EMANUELS SOLUTIONS, C=KE"
          {
            echo "KEYSTORE_BASE64"
            base64 -w0 lindaplay.jks
            echo
            echo
            echo "KEYSTORE_PASSWORD"
            echo "$PASS"
            echo
            echo "KEY_ALIAS"
            echo "lindaplay"
            echo
            echo "KEY_PASSWORD"
            echo "$PASS"
          } > signing-key-SECRET.txt

      - name: Save the key file (keep it private)
        uses: actions/upload-artifact@v4
        with:
          name: signing-key-SECRET
          path: signing-key-SECRET.txt
          retention-days: 1
          if-no-files-found: error
